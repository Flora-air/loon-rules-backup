name: Daily Loon rules backup
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'sources.json', '.github/workflows/sync.yml']
permissions:
  contents: write
concurrency:
  group: loon-rules-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test last-known-good retention
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Download and validate
        id: download
        continue-on-error: true
        run: python3 scripts/sync.py
      - name: Commit rules and daily status without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.lsr' sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily validated rule backup and status'
            git push origin HEAD:main
          fi
      - name: Surface upstream failures after saving status
        if: steps.download.outcome == 'failure'
        run: |
          echo 'Upstream unavailable or invalid. Last known good rules retained.'
          exit 1
